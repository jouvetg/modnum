   <g id="text_17">
    <text xml:space="preserve" style="white-space: pre; fill: #ffffff; font: 14px 'DejaVu Sans', sans-serif; text-anchor: middle" x="319.773379" y="475.885594" transform="rotate(-0 319.773379 475.885594)">nx = 6 nœuds  →  nx − 1 = 5 intervalles</text>
   </g>
   <g id="text_18">
    <text xml:space="preserve" style="white-space: pre; fill: #9a9a9a; font: 13px 'DejaVu Sans', sans-serif; text-anchor: start" x="624.483276" y="44.600153" transform="rotate(-0 624.483276 44.600153)">code</text>
