    <text xml:space="preserve" style="white-space: pre; fill: #ffffff; font: 20px 'DejaVu Sans Mono', monospace; text-anchor: start" x="23.063607" y="148.403573" transform="rotate(-0 23.063607 148.403573)">if i == 0:</text>
   </g>
