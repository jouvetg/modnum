   <g id="text_19">
    <text xml:space="preserve" style="white-space: pre; fill: #e660aa; font: 13.5px 'DejaVu Sans Mono', monospace; text-anchor: start" x="624.483276" y="77.800606" transform="rotate(-0 624.483276 77.800606)">dx = Lx / (nx - 1)          # 5 intervalles en x</text>
   </g>
   <g id="text_20">
    <text xml:space="preserve" style="white-space: pre; fill: #40d0d0; font: 13.5px 'DejaVu Sans Mono', monospace; text-anchor: start" x="624.483276" y="117.118012" transform="rotate(-0 624.483276 117.118012)">dy = Ly / (ny - 1)          # 4 intervalles en y</text>
   </g>
   <g id="text_21">
    <text xml:space="preserve" style="white-space: pre; fill: #e660aa; font: 13.5px 'DejaVu Sans Mono', monospace; text-anchor: start" x="624.483276" y="195.752824" transform="rotate(-0 624.483276 195.752824)">x = np.linspace(0, Lx, nx)  # nx = 6 abscisses</text>
   </g>
   <g id="text_22">
    <text xml:space="preserve" style="white-space: pre; fill: #40d0d0; font: 13.5px 'DejaVu Sans Mono', monospace; text-anchor: start" x="624.483276" y="235.304371" transform="rotate(-0 624.483276 235.304371)">y = np.linspace(0, Ly, ny)  # ny = 5 ordonnées</text>
   </g>
   <g id="text_23">
    <text xml:space="preserve" style="white-space: pre; fill: #6cc3ff; font: 13.5px 'DejaVu Sans Mono', monospace; text-anchor: start" x="624.483276" y="313.705043" transform="rotate(-0 624.483276 313.705043)">T = np.ones((ny, nx)) * Tinit</text>
   </g>
   <g id="text_24">
    <text xml:space="preserve" style="white-space: pre; fill: #6cc3ff; font: 14px 'DejaVu Sans', sans-serif; text-anchor: start" x="624.483276" y="357.056299" transform="rotate(-0 624.483276 357.056299)">une valeur par nœud ●  :  taille (ny, nx) = (5, 6)</text>
   </g>
