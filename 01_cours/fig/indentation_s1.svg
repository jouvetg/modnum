   <g id="text_4">
    <text xml:space="preserve" style="white-space: pre; fill: #ffffff; font: 20px 'DejaVu Sans Mono', monospace; text-anchor: start" x="23.063607" y="46.036264" transform="rotate(-0 23.063607 46.036264)">for i in range(10):</text>
   </g>
