name: Deploy Jupyter Book
on:
  push:
    branches:
      - main

# Sans cela, le GITHUB_TOKEN est en lecture seule et la publication
# sur la branche gh-pages est refusee.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jupyter-book

      - name: Build Jupyter Book
        run: jupyter-book build .

      # Equivalent de "ghp-import -n -p -f _build/html", mais en git explicite :
      # le jeton est passe dans l'URL, et chaque commande est visible dans le log.
      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          test -d _build/html
          touch _build/html/.nojekyll
          cd _build/html
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update documentation"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
